<!doctype html>
<html lang="en" data-hand="right">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shots on Goal</title>
  <meta name="description" content="NHL scores, schedules, standings and where to watch.">
  <!-- The status bar strip in the installed iPhone app, in the page's colour (light / dark). House lights in the menu
       can pick a look of their own: the script below (and web/app.js applyLights) then sets both to it. -->
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default": iOS paints the status bar solid and the app starts below it. Drawing under it (black-translucent) let
       iOS fade the top bar near the Dynamic Island in the installed app, and iOS 26 keeps changing how that works. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shots on Goal">
  <!-- AGPL: people using the site can get its source. Point this at your fork. -->
  <meta name="source" content="https://github.com/DieLaughing/shotsongoal">
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <link rel="icon" href="icons/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=4">
  <!-- Before the first paint: House lights (light or dark, and which shade), where the menu bar sits and how Tonight's
       games are drawn, all per device (web/app.js applyLights, applyNavAt, cardsAs), so the app never flashes the wrong look. -->
  <script>try { var d = document.documentElement, L = localStorage.getItem("lights") || "auto";
    var c = { day: "#f5f6f8", dusk: "#d5dae1", night: "#0e1116", out: "#000000" }[L];
    if (!c) L = "auto";
    // Dim at puck drop, during a game (web/app.js setDimmed): straight to Lights out on a reload, for up to 4 hours.
    if (localStorage.getItem("dimLive") === "1" && Date.now() - +localStorage.getItem("dimNow") < 144e5) { L = "out"; c = "#000000"; }
    var dark = L === "night" || L === "out" || (L === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    d.dataset.scheme = dark ? "dark" : "light"; d.dataset.lights = L;
    d.dataset.nav = localStorage.getItem("navAt") === "bottom" ? "bottom" : "top";
    d.dataset.cards = localStorage.getItem("cards") === "list" ? "list" : "tiles";
    if (c) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = c; });
  } catch (e) { document.documentElement.dataset.scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }</script>
  <link rel="stylesheet" href="style.css">
  <!-- Your team's colours, from last time, in place before the first paint (web/app.js applyAccent). -->
  <style id="team-accent"></style>
  <script>try { document.getElementById("team-accent").textContent = localStorage.getItem("accentCss") || ""; } catch { /* fine */ }</script>
  <!-- Asked for as soon as this page lands, so they're here by the time app.js has downloaded. -->
  <link rel="preload" href="/api/me" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="/api/changes" as="fetch" crossorigin="anonymous">
</head>
<body>
  <!-- The menu bar: one pill, at the top (or the bottom, Settings > Display). On a phone it holds the goal horn, the name
       with what's on right now, and the menu; a wide screen adds the main pages either side of the name. -->
  <header class="top" id="top">
    <div class="navpill">
      <button class="pill-btn" id="horn-btn" type="button" aria-pressed="false" aria-label="Goal horn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path class="horn-on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="horn-off" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <a class="pill-link" href="#/" data-nav="tonight">Tonight</a>
      <a class="pill-link" href="#/picks" data-nav="picks">Pick'em</a>
      <a class="brand" href="#/"><span class="brand-name">Shots on Goal</span><span class="brand-line" id="brand-line"></span></a>
      <a class="pill-link" href="#/league" data-nav="league">League</a>
      <a class="pill-link" href="#/wire" data-nav="wire">Wire</a>
      <a class="pill-btn pill-search" href="#/search" data-nav="search" aria-label="Search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a>
      <button class="pill-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Menu"><span class="burger" aria-hidden="true"><i></i><i></i></span></button>
    </div>
  </header>
  <div class="menu" id="menu" hidden>
    <nav class="menu-links" aria-label="Main">
      <a href="#/" data-nav="tonight"><b>Tonight</b><span id="info-tonight">Scores and where to watch</span></a>
      <a href="#/picks" data-nav="picks"><b>Pick'em</b><span id="info-picks">Call tonight's winners</span></a>
      <a href="#/league" data-nav="league"><b>League</b><span id="info-league">Standings, leaders, What if?</span></a>
      <a href="#/wire" data-nav="wire"><b>Wire</b><span id="info-wire">Trades, news and insiders</span></a>
      <a href="#/search" data-nav="search"><b>Search</b><span>Players, teams, “Bruins vs Leafs”</span></a>
      <a href="#/settings" data-nav="settings"><b>Settings</b><span id="info-settings">Your teams, alerts, display</span></a>
    </nav>
    <div class="menu-ctl">
      <div class="league" role="group" aria-label="League">
        <button data-league="nhl">NHL</button><button data-league="pwhl">PWHL</button><button data-league="ncaa">NCAA</button><button data-league="both">All</button>
      </div>
      <div class="house-slot"></div>
    </div>
  </div>
  <main id="view" aria-live="polite"></main>
  <footer class="foot" id="foot" hidden><div class="foot-house house-slot"></div><a href="#/report">Something wrong? Report it</a></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
