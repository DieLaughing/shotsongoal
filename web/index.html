<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shots on Goal</title>
  <meta name="description" content="NHL scores, schedules, standings and where to watch.">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shots on Goal">
  <!-- AGPL: people using the site can get its source. Point this at your fork. -->
  <meta name="source" content="https://github.com/DieLaughing/shotsongoal">
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <link rel="icon" href="icons/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=4">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><img class="logo" src="icons/icon.svg?v=3" alt="" width="26" height="26"><span class="brand-name">Shots on Goal</span></a>
    <div class="league" role="group" aria-label="League">
      <button data-league="nhl">NHL</button><button data-league="pwhl">PWHL</button><button data-league="both">Both</button>
    </div>
    <a class="top-link" href="#/settings" data-nav="settings" aria-label="Settings">Settings</a>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="foot" id="foot" hidden><a href="#/report">Something wrong? Report it</a></footer>
  <nav class="tabs" id="tabs" hidden>
    <a href="#/" data-nav="tonight">Tonight</a>
    <a href="#/picks" data-nav="picks">Pick'em</a>
    <a href="#/wire" data-nav="wire">Wire</a>
    <a href="#/standings" data-nav="standings">Standings</a>
    <a href="#/teams" data-nav="teams">Teams</a>
    <a href="#/admin" data-nav="admin" id="admin-tab" hidden>Admin</a>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
