# US where-to-watch. Recheck every October: TV deals and team streaming deals change most seasons.
# Built from every 2026-27 regular-season game's tvBroadcasts (surveyed 2026-10-11).
#
# services: what a person can tick in Settings. Each network says which service carries it.
# A network missing from this file still shows, with its raw name and no "you have it" check.

services:
  espn_plus:
    label: "ESPN+ (or Hulu / Disney+ bundle)"
    url: "https://plus.espn.com/nhl"
    # With the Disney+ bundle, live ESPN+ games also play inside Hulu.
    also: [{ name: "Hulu", url: "https://www.hulu.com/hub/sports" }]
  espn:       { label: "ESPN via a TV login",              url: "https://www.espn.com/watch/" }
  abc:        { label: "ABC (antenna or TV login)",        url: "https://abc.com/watch-live" }
  tnt:        { label: "TNT / truTV via TV login, or HBO Max", url: "https://www.hbomax.com/sports" }
  nhln:       { label: "NHL Network via a TV login" }
  b1g_plus:   { label: "B1G+ (Big Ten college games)", url: "https://www.bigtenplus.com/", college: true }
  flo:        { label: "FloHockey / FloSports (college games)", url: "https://www.flohockey.tv/", college: true }
  nchc_tv:    { label: "NCHC.tv (NCHC college games)", url: "https://nchc.tv/", college: true }
  regional:   { label: "My local team's channel (TV login or team app)" }

# National US networks. "exclusive" = when listed with no home/away channels, every US viewer must use it.
national:
  ESPN+:      { service: espn_plus, app: "ESPN+" }
  HULU:       { service: espn_plus, app: "ESPN+" }
  Disney+:    { service: espn_plus, app: "ESPN+" }
  ESPN:       { service: espn, app: "ESPN app" }
  ESPN2:      { service: espn, app: "ESPN app" }
  ABC:        { service: abc, app: "ABC" }
  TNT:        { service: tnt, app: "HBO Max / TNT" }
  truTV:      { service: tnt, app: "HBO Max / TNT" }
  HBO MAX:    { service: tnt, app: "HBO Max / TNT" }
  NHLN:       { service: nhln, app: "NHL Network", not_exclusive: true }

# Team channels: the app to use, keyed by network name as the NHL lists it. Anything not listed shows
# its network name as-is. Only add names and links you've checked (links checked 2026-10-11).
regional:
  NESN:        { app: "NESN 360", url: "https://watch.nesn.com/" }
  Prime Video: { app: "Prime Video", url: "https://www.primevideo.com/" }
  SCRIPPS:     { app: "Scripps (free, over the air)" }

# ---- College (NCAA men's and women's) ------------------------------------------------------------------------------
# ESPN lists one or two streams per college game, by these names (surveyed Oct 2026: ESPN+ 88, B1G+ 24, FloSports 19,
# NCHCHockey.com 19, Midco 24 of ~200 games). No blackouts: whatever's listed is where it is. Unlisted names show as-is.
college:
  ESPN+:             { service: espn_plus, app: "ESPN+" }
  ESPN:              { service: espn, app: "ESPN app" }
  ESPN2:             { service: espn, app: "ESPN app" }
  ESPNU:             { service: espn, app: "ESPN app" }
  B1G+:              { service: b1g_plus, app: "B1G+" }
  FloSports:         { service: flo, app: "FloHockey" }
  FloHockey:         { service: flo, app: "FloHockey" }
  NCHCHockey.com:    { service: nchc_tv, app: "NCHC.tv" }
  Midco Sports Net:  { app: "Midco Sports", url: "https://www.midcosportsplus.com/" }
  Midco Sports Plus: { app: "Midco Sports+", url: "https://www.midcosportsplus.com/" }

# ---- Canada (settings.country = CA) ------------------------------------------------------------------------------
# Built from every 2026-27 regular-season game's Canadian tvBroadcasts (surveyed 2026-10-18) and the 2026-27 deals:
# Sportsnet (Rogers) has 550+ national games, no blackouts anywhere in Canada; Monday Night Hockey streams only on
# Sportsnet+; Prime Video has Wednesday Night Hockey; TVA Sports is the French national; CBC carries no games from
# 2026-27. Regional games (TSN, RDS, Sportsnet regionals) only play inside the team's region; outside it, and for every
# game no Canadian broadcaster lists (US teams only), it's Sportsnet+ Premium (out-of-market).
canada:
  services:
    sn_tv:          { label: "Sportsnet on TV (cable or satellite login)", url: "https://watch.sportsnet.ca/" }
    snplus:         { label: "Sportsnet+ Standard (or the Monday Night Hockey add-on)", url: "https://watch.sportsnet.ca/" }
    snplus_premium: { label: "Sportsnet+ Premium (adds out-of-market games)", url: "https://watch.sportsnet.ca/" }
    tsn:            { label: "TSN (TV login or a TSN subscription)", url: "https://www.tsn.ca/live/" }
    rds:            { label: "RDS (en français)", url: "https://www.rds.ca/emissions/en-direct/" }
    tva:            { label: "TVA Sports (en français)", url: "https://www.tvasports.ca/" }
    prime_ca:       { label: "Prime Video", url: "https://www.primevideo.com/" }
  # Each network: the app to name, the services that carry it (any one will do), french: listed after English ones.
  networks:
    SN:      { app: "Sportsnet",          services: [sn_tv, snplus, snplus_premium] }
    SN1:     { app: "Sportsnet One",      services: [sn_tv, snplus, snplus_premium] }
    SN360:   { app: "Sportsnet 360",      services: [sn_tv, snplus, snplus_premium] }
    SNP:     { app: "Sportsnet Pacific",  services: [sn_tv, snplus, snplus_premium] }
    SNW:     { app: "Sportsnet West",     services: [sn_tv, snplus, snplus_premium] }
    SNO:     { app: "Sportsnet Ontario",  services: [sn_tv, snplus, snplus_premium] }
    SNE:     { app: "Sportsnet East",     services: [sn_tv, snplus, snplus_premium] }
    SN+:     { app: "Sportsnet+",         services: [snplus, snplus_premium] }
    Prime:   { app: "Prime Video",        services: [prime_ca] }
    TSN2:    { app: "TSN2",               services: [tsn] }
    TSN3:    { app: "TSN3",               services: [tsn] }
    TSN4:    { app: "TSN4",               services: [tsn] }
    TSN5:    { app: "TSN5",               services: [tsn] }
    RDS:     { app: "RDS",                services: [rds], french: true }
    RDS2:    { app: "RDS2",               services: [rds], french: true }
    RDSI:    { app: "RDS Info",           services: [rds], french: true }
    TVAS:    { app: "TVA Sports",         services: [tva], french: true }
    TVAS2:   { app: "TVA Sports 2",       services: [tva], french: true }
    TVAS-D:  { app: "TVA Sports Direct",  services: [tva], french: true }
  out_of_market: { app: "Sportsnet+ Premium", services: [snplus_premium] }
